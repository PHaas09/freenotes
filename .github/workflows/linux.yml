# Builds the Linux app on a free GitHub Ubuntu machine and packs it as a .deb
# (double-click or `sudo apt install ./freenotes_*.deb`). Built on 22.04 so it also runs on newer Ubuntu.
name: Linux-App bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build-Werkzeuge
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev xvfb imagemagick
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0 # same version as the other builds
          cache: true
      - run: flutter pub get
      - name: Rust-Kern für die Tests bauen
        run: cargo build --release --manifest-path rust/Cargo.toml
      - run: flutter test
      - run: flutter build linux --release
      - name: .deb packen
        run: |
          VER=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          PKG="freenotes_${VER}_amd64"
          APP=io.github.phaas09.freenotes
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/freenotes" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/x64/release/bundle/. "$PKG/opt/freenotes/"
          ln -s /opt/freenotes/freenotes "$PKG/usr/bin/freenotes"
          convert assets/icon/icon.png -resize 512x512 "$PKG/usr/share/icons/hicolor/512x512/apps/$APP.png"
          cat > "$PKG/usr/share/applications/$APP.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=FreeNotes
          Comment=Handschriftliche Notizen, PDFs beschriften, NAS-Sync
          Exec=freenotes
          Icon=$APP
          Terminal=false
          Categories=Office;Education;
          StartupWMClass=freenotes
          EOF
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: freenotes
          Version: $VER
          Architecture: amd64
          Maintainer: FreeNotes <231498577+PHaas09@users.noreply.github.com>
          Depends: libgtk-3-0 | libgtk-3-0t64, libsecret-1-0
          Recommends: xdg-desktop-portal, gnome-keyring
          Section: editors
          Priority: optional
          Homepage: https://github.com/PHaas09/freenotes
          Description: Free handwriting notes app
           Notebooks with pens, highlighter and PDF annotation, an endless sheet,
           and automatic sync to your own NAS over WebDAV.
          EOF
          dpkg-deb --build --root-owner-group "$PKG"
      - name: Testinstallation und Start (20 s ohne Absturz)
        run: |
          sudo apt-get install -y ./freenotes_*.deb
          mkdir -p ~/Documents
          code=0
          xvfb-run -a timeout 20 freenotes || code=$?
          test "$code" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: FreeNotes-Linux
          path: '*.deb'
      - name: An den Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" freenotes_*.deb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
