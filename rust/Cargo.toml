[package]
name = "freenotes_core"
version = "0.1.0"
edition = "2021"
description = "FreeNotes core: stroke geometry, file format, tile rendering, search and scan sharpening"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
rstar = "0.12"
rayon = "1"
miniz_oxide = "0.8"
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
